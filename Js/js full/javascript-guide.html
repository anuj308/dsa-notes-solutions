    <div class="row"><input type="text" id="dbInput" placeholder="Type something..."><span class="stat">raw events: <b class="warn" id="dbRaw">0</b></span><span class="stat">debounced calls: <b id="dbDx">0</b></span></div></div>`;
  if(kind==='throttle') return `<div class="demo"><div class="demo-title">⚡ Live: Throttle — click fast!</div>
    <div class="row"><button id="thBtn">Click me fast!</button><span class="stat">total clicks: <b class="warn" id="thClicks">0</b></span><span class="stat">throttled calls: <b id="thCalls">0</b></span></div></div>`;
  if(kind==='counter') return `<div class="demo"><div class="demo-title">⚡ Live: setInterval counter</div>
    <div class="row"><button id="ctStart">▶ Start Counter</button><button id="ctStop">⏸ Stop Counter</button><span class="stat" style="font-size:22px"><b id="ctVal">0</b></span></div></div>`;
  if(kind==='dialog') return `<div class="demo"><div class="demo-title">⚡ Live: Dialog boxes</div>
    <div class="row"><button id="dlAlert">alert()</button><button id="dlPrompt">prompt()</button><button id="dlConfirm">confirm()</button><span class="stat" id="dlOut">click a button…</span></div></div>`;
  return '';
}
function initDemos(){
  // debounce
  const dbI = document.getElementById('dbInput');
  if(dbI){
    let raw=0,dx=0,timer;
    const debounced = fn => { clearTimeout(timer); timer=setTimeout(fn,800); };
    dbI.addEventListener('input',()=>{
      raw++; document.getElementById('dbRaw').textContent=raw;
      debounced(()=>{ dx++; document.getElementById('dbDx').textContent=dx; });
    });
  }
  // throttle
  const thB = document.getElementById('thBtn');
  if(thB){
    let clicks=0,calls=0,last=0;
    thB.addEventListener('click',()=>{
      clicks++; document.getElementById('thClicks').textContent=clicks;
      const now=Date.now();
      if(now-last>=1500){ calls++; last=now; document.getElementById('thCalls').textContent=calls; }
    });
  }
  // counter
  const ctS = document.getElementById('ctStart');
  if(ctS){
    let id=null,c=0;
    ctS.addEventListener('click',()=>{
      if(!id){ id=setInterval(()=>{ c++; document.getElementById('ctVal').textContent=c; },1000); }
    });
    document.getElementById('ctStop').addEventListener('click',()=>{ clearInterval(id); id=null; });
  }
  // dialogs
  const dlA = document.getElementById('dlAlert');
  if(dlA){
    const out=document.getElementById('dlOut');
    dlA.addEventListener('click',()=>{ alert('Hello Javascript'); out.textContent='alert shown'; });
    document.getElementById('dlPrompt').addEventListener('click',()=>{
      const n=prompt('Enter your name'); out.textContent = n ? `you typed: ${n}` : 'cancelled';
    });
    document.getElementById('dlConfirm').addEventListener('click',()=>{
      out.textContent = confirm('Are you sure want to delete?') ? 'user confirmed ✅' : 'user cancelled ❌';
    });
  }
}

/* ---------- write to DOM ---------- */
sidebar.innerHTML = navHTML;
content.innerHTML = mainHTML + `<div id="noresults">`;
initDemos();

/* ---------- open first cards of each part? just first card ---------- */
content.querySelector('.card').classList.add('open');

/* ---------- navigation & progress ---------- */
const navLinks = [...document.querySelectorAll('.nav-link')];
const cards = [...document.querySelectorAll('.card')];
const read = new Set(JSON.parse(localStorage.getItem('js-guide-progress')||'[]'));

function updateProgress(){
  document.getElementById('progressText').textContent = `${read.size} / ${allTopics.length} read`;
  navLinks.forEach(l=>l.classList.toggle('done', read.has(l.dataset.target)));
}
function markRead(id){
  const card = document.getElementById(id);
  if(!card) return;
  card.addEventListener('scroll',()=>{});
  const obs = new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting && e.intersectionRatio>0.55){ read.add(id); localStorage.setItem('js-guide-progress',JSON.stringify([...read])); updateProgress(); obs.disconnect(); } });
  },{threshold:0.55});
  obs.observe(card);
}
allTopics.forEach(t=>markRead(t.id));
updateProgress();

navLinks.forEach(link=>{
  link.addEventListener('click',()=>{
    const card = document.getElementById(link.dataset.target);
    card.classList.add('open');
    card.scrollIntoView({behavior:'smooth',block:'start'});
    history.replaceState(null,'','#'+link.dataset.target);
    if(window.innerWidth<=1024) sidebar.classList.remove('mobile-open');
  });
});
// deep-link on load
if(location.hash){
  const c=document.getElementById(location.hash.slice(1));
  if(c) c.classList.add('open');
}

// active link highlight on scroll
const spy = new IntersectionObserver(es=>{
  es.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(l=>l.classList.toggle('active', l.dataset.target===e.target.id));
    }
  });
},{rootMargin:'-20% 0px -70% 0px'});
cards.forEach(c=>spy.observe(c));

/* ---------- search ---------- */
document.getElementById('searchInput').addEventListener('input',e=>{
  const q=e.target.value.toLowerCase().trim();
  let any=false;
  cards.forEach(c=>{
    const topic=allTopics.find(t=>t.id===c.id);
    const match=!q || topic.t.toLowerCase().includes(q) || c.textContent.toLowerCase().includes(q);
    c.style.display=match?'':'none';
    if(match&&q) any=true;
    if(q&&match) c.classList.add('open'); else if(q) c.classList.remove('open');
  });
  document.querySelectorAll('.part').forEach(p=>{
    p.style.display=q?'none':'';
  });
  document.getElementById('noresults').style.display=(q&&!any)?'block':'none';
});

/* ---------- read bar + back to top ---------- */
window.addEventListener('scroll',()=>{
  const h=document.documentElement;
  const pct=h.scrollTop/(h.scrollHeight-h.clientHeight)*100;
  document.getElementById('readbar').style.width=pct+'%';
  document.getElementById('backTop').classList.toggle('show',h.scrollTop>600);
});
document.getElementById('backTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

/* ---------- reset progress ---------- */
document.getElementById('resetBtn').addEventListener('click',()=>{
  read.clear(); localStorage.removeItem('js-guide-progress'); updateProgress();
});

/* ---------- mobile sidebar ---------- */
document.getElementById('burger').addEventListener('click',()=>sidebar.classList.toggle('mobile-open'));

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); document.getElementById('searchInput').focus(); }
});
</script>
</body>
</html>
