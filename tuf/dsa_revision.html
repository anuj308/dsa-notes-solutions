  { id:"b2", topic:"Bit Manipulation", name:"Power of Two", difficulty:"easy", pattern:"Bit Check", link:"https://leetcode.com/problems/power-of-two/",

  { id:"b4", topic:"Bit Manipulation", name:"Swap Two Numbers", difficulty:"easy", pattern:"XOR", link:"",

    code:'void swapNumber(int &a, int &b) {\n  a = a ^ b;\n  b = a ^ b; // (a^b)^b = a\n  a = a ^ b; // (a^b)^a = b\n}',
    tc:"O(1)", sc:"O(1)" },
  { id:"b5", topic:"Bit Manipulation", name:"Divide Two Integers", difficulty:"medium", pattern:"Bit Manipulation", link:"https://leetcode.com/problems/divide-two-integers/",
    notes:"Use bit shifting to double divisor. Subtract from dividend. Handle INT_MIN and overflow.",
    code:'int divide(int dividend, int divisor) {\n  if(dividend==divisor) return 1;\n  bool sign = (dividend<0)==(divisor<0);\n  long n=labs(dividend), d=labs(divisor), ans=0;\n  while(n>=d) {\n    int cnt=0;\n    while(n >= (d << (cnt+1))) cnt++;\n    ans += (1L << cnt);\n    n -= (d << cnt);\n  }\n  if(ans==(1L<<31)) return sign?INT_MAX:INT_MIN;\n  return sign ? ans : -ans;\n}',
    tc:"O(log² n)", sc:"O(1)" },
  { id:"b6", topic:"Bit Manipulation", name:"Minimum Bit Flips", difficulty:"easy", pattern:"XOR + Count", link:"https://leetcode.com/problems/minimum-bit-flips-to-convert-number/",
    notes:"XOR start and goal. Count set bits in result.",
    code:'int minBitFlips(int start, int goal) {\n  return __builtin_popcount(start ^ goal);\n}',

    code:'vector<vector<int>> subsets(vector<int>& nums) {\n  int n=nums.size(), total=1<<n;\n  vector<vector<int>> ans;\n  for(int mask=0;mask<total;mask++) {\n    vector<int> sub;\n    for(int i=0;i<n;i++) if(mask & (1<<i)) sub.push_back(nums[i]);\n    ans.push_back(sub);\n  }\n  return ans;\n}',

    code:'int xor1toN(int n) {\n  if(n%4==1) return 1;\n  if(n%4==2) return n+1;\n  if(n%4==3) return 0;\n  return n;\n}\nint findXOR(int l, int r) {\n  return xor1toN(l-1) ^ xor1toN(r);\n}',

    code:'vector<int> twoOddNum(vector<int> Arr) {\n  int xo=0;\n  for(int x:Arr) xo^=x;\n  int rb = xo & -xo; // rightmost set bit\n  int b1=0,b2=0;\n  for(int x:Arr) {\n    if(x & rb) b1^=x;\n    else b2^=x;\n  }\n  if(b1>b2) return {b1,b2};\n  return {b2,b1};\n}',

// ============================================================
// RENDER FUNCTIONS
// ============================================================
let activeFilter = 'all';
let filteredProblems = [...PROBLEMS];

// Highlight C++ code
function highlightCode(code) {
  let h = code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\/\/.*/g, m => `<span class="cm">${m}</span>`)
    .replace(/\/\*[\s\S]*?\*\//g, m => `<span class="cm">${m}</span>`)
    .replace(/\b(int|void|bool|double|long|long long|char|string|auto|const|using|namespace|struct|class|public|private|return|if|else|for|while|do|break|continue|true|false|nullptr|NULL|new|delete|this|static|virtual|override|template|typename|include|define)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(vector|unordered_map|unordered_set|map|set|stack|queue|priority_queue|pair|list|deque|multiset|function|string|TreeNode|ListNode|Node)\b/g, '<span class="tp">$1</span>')
    .replace(/\b(INT_MAX|INT_MIN|LLONG_MAX|LLONG_MIN|INT_MIN|INT_MAX)\b/g, '<span class="num">$1</span>')
    .replace(/"[^"]*"/g, m => `<span class="str">${m}</span>`)
    .replace(/\'.\'/g, m => `<span class="str">${m}</span>`)
    .replace(/\b(\d+)\b/g, '<span class="num">$1</span>');
  return h;
}

// Get topics
function getTopics() {
  return [...new Set(PROBLEMS.map(p => p.topic))].sort();
}

// Build sidebar
function buildSidebar() {
  const topics = getTopics();
  const sidebar = document.getElementById('sidebarLinks');
  let html = '';
  for(const topic of topics) {
    const count = PROBLEMS.filter(p => p.topic === topic).length;
    html += `<a class="sidebar-link" href="#topic-${topic.replace(/\s+/g,'-')}" onclick="closeSidebar()">${topic} <span class="count">${count}</span></a>`;
  }
  sidebar.innerHTML = html;

  // Filter chips
  const chips = document.getElementById('filterChips');
  let chipHtml = `<button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All (${PROBLEMS.length})</button>`;
  for(const topic of topics) {
    const count = PROBLEMS.filter(p => p.topic === topic).length;
    chipHtml += `<button class="filter-chip" data-filter="${topic}" onclick="setFilter('${topic}')">${topic} (${count})</button>`;
  }
  chips.innerHTML = chipHtml;
}

// Set filter
function setFilter(topic) {
  activeFilter = topic;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === topic));
  filterProblems();
}

// Filter problems
function filterProblems() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  filteredProblems = PROBLEMS.filter(p => {
    if(activeFilter !== 'all' && p.topic !== activeFilter) return false;
    if(query && !p.name.toLowerCase().includes(query) && !p.topic.toLowerCase().includes(query) && !p.pattern.toLowerCase().includes(query)) return false;
    return true;
  });
  renderProblems();
  updateStats();
}

// Update stats
function updateStats() {
  document.getElementById('totalCount').textContent = PROBLEMS.length;
  const total = filteredProblems.length;
  const easy = filteredProblems.filter(p => p.difficulty === 'easy').length;
  const medium = filteredProblems.filter(p => p.difficulty === 'medium').length;
  const hard = filteredProblems.filter(p => p.difficulty === 'hard').length;
  const topics = [...new Set(filteredProblems.map(p => p.topic))].length;
  document.getElementById('statsStrip').innerHTML = `
    <span><i class="fas fa-list" style="color:var(--accent)"></i> ${total} problems</span>
    <span><i class="fas fa-folder" style="color:var(--accent2)"></i> ${topics} topics</span>
    <span><span style="color:var(--easy)">●</span> ${easy} Easy</span>
    <span><span style="color:var(--medium)">●</span> ${medium} Medium</span>
    <span><span style="color:var(--hard)">●</span> ${hard} Hard</span>
  `;
}

// Render problems grouped by topic
function renderProblems() {
  const container = document.getElementById('problemContainer');
  if(filteredProblems.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--text3);font-size:0.9rem;"><i class="fas fa-search" style="font-size:2rem;opacity:0.3;margin-bottom:0.5rem;display:block;"></i>No problems match your filter</div>`;
    return;
  }

  const grouped = {};
  for(const p of filteredProblems) {
    if(!grouped[p.topic]) grouped[p.topic] = [];
    grouped[p.topic].push(p);
  }

  const iconMap = {
    'Patterns': 'fa-shapes','Basic Math': 'fa-calculator','Recursion': 'fa-sync','Sorting': 'fa-sort',
    'Arrays': 'fa-layer-group','Binary Search': 'fa-search','Linked List': 'fa-link','Sliding Window': 'fa-window-maximize',
    'Stack & Queue': 'fa-cubes','Trees': 'fa-tree','BST': 'fa-sitemap','Graph': 'fa-project-diagram',
    'Greedy': 'fa-hand-holding-usd','DP': 'fa-brain','Bit Manipulation': 'fa-microchip','String': 'fa-font',
    'Hashing': 'fa-hashtag','STL': 'fa-code'
  };

  let html = '';
  for(const [topic, probs] of Object.entries(grouped)) {
    const topicId = `topic-${topic.replace(/\s+/g,'-')}`;
    html += `<div class="topic-section" id="${topicId}">`;
    html += `<div class="topic-header"><div class="icon"><i class="fas ${iconMap[topic] || 'fa-folder'}"></i></div><h2>${topic}</h2><span class="count-badge">${probs.length} problems</span></div>`;
    for(const p of probs) {
      const codeId = `code-${p.id}`;
      html += `<div class="problem-card" data-topics="${p.topic}">`;
      html += `<div class="top-row"><span class="name">${p.name}</span><span class="difficulty ${p.difficulty}">${p.difficulty}</span></div>`;
      html += `<div class="meta-row">`;
      html += `<span class="meta-tag pattern"><i class="fas fa-tag"></i> ${p.pattern}</span>`;
      if(p.tc) html += `<span class="meta-tag complexity"><i class="fas fa-clock"></i> ${p.tc}</span>`;
      if(p.sc) html += `<span class="meta-tag complexity"><i class="fas fa-memory"></i> ${p.sc}</span>`;
      if(p.link) html += `<span class="meta-tag"><a href="${p.link}" target="_blank"><i class="fas fa-external-link-alt"></i> Link</a></span>`;
      html += `</div>`;
      if(p.notes) html += `<div class="notes"><strong>💡 Approach:</strong> ${p.notes}</div>`;
      html += `<div class="code-block">
        <div class="code-header">
          <span><i class="fas fa-code"></i> C++</span>
          <button class="copy-btn" onclick="copyCode('${codeId}')"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <pre id="${codeId}">${highlightCode(p.code)}</pre>
      </div>`;
      html += `</div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

// Copy code
function copyCode(id) {
  const el = document.getElementById(id);
  const text = el.textContent || el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = el.parentElement.querySelector('.copy-btn');
    btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
    setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy', 2000);
  });
}

// ============================================================
// RANDOM PICKER
// ============================================================
function openRandomPicker() {
  document.getElementById('randomModal').classList.add('show');
  // Populate topics
  const sel = document.getElementById('randomTopicFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="all">All Topics</option>';
  for(const t of getTopics()) {
    sel.innerHTML += `<option value="${t}">${t}</option>`;
  }
  sel.value = cur;
  document.getElementById('randomResult').classList.remove('show');
}

function closeRandomPicker() {
  document.getElementById('randomModal').classList.remove('show');
}

function pickRandom() {
  const topic = document.getElementById('randomTopicFilter').value;
  const diff = document.getElementById('randomDifficultyFilter').value;
  let pool = [...PROBLEMS];
  if(topic !== 'all') pool = pool.filter(p => p.topic === topic);
  if(diff !== 'all') pool = pool.filter(p => p.difficulty === diff);
  if(pool.length === 0) {
    document.getElementById('randomResult').innerHTML = '<div style="text-align:center;padding:1rem;color:var(--text3)">No problems found matching criteria</div>';
    document.getElementById('randomResult').classList.add('show');
    return;
  }
  const p = pool[Math.floor(Math.random() * pool.length)];
  const codeId = `rcode-${Date.now()}`;
  document.getElementById('randomResult').innerHTML = `
    <div class="problem-card" style="margin:0;border-color:var(--accent);">
      <div class="top-row"><span class="name">${p.name}</span><span class="difficulty ${p.difficulty}">${p.difficulty}</span></div>
      <div class="meta-row">
        <span class="meta-tag"><i class="fas fa-folder"></i> ${p.topic}</span>
        <span class="meta-tag pattern"><i class="fas fa-tag"></i> ${p.pattern}</span>
        ${p.tc ? `<span class="meta-tag complexity">${p.tc}</span>` : ''}
        ${p.sc ? `<span class="meta-tag complexity">${p.sc}</span>` : ''}
      </div>
      ${p.notes ? `<div class="notes"><strong>💡 Approach:</strong> ${p.notes}</div>` : ''}
      <div class="code-block">
        <div class="code-header">
          <span><i class="fas fa-code"></i> C++</span>
          <button class="copy-btn" onclick="copyCode('${codeId}')"><i class="fas fa-copy"></i> Copy</button>
        </div>
        <pre id="${codeId}">${highlightCode(p.code)}</pre>
      </div>
    </div>
  `;
  document.getElementById('randomResult').classList.add('show');
}

// ============================================================
// MOBILE SIDEBAR
// ============================================================
document.getElementById('mobileToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('show');
  document.getElementById('sidebarBackdrop').classList.toggle('show');
});
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('show');
  document.getElementById('sidebarBackdrop').classList.remove('show');
}

// Search on enter
document.getElementById('searchInput').addEventListener('keyup', (e) => {
  if(e.key === 'Enter') filterProblems();
});

// ============================================================
// INIT
// ============================================================
buildSidebar();
filterProblems();
updateStats();
</script>
</body>
</html>
