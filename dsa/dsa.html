<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete DSA Revision Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ===== same styles as before – kept compact ===== */
:root {
  --bg: #0a0e1a; --bg2: #0f1528; --bg3: #151e38; --card: rgba(18,26,50,0.85);
  --border: rgba(60,100,255,0.12); --border-h: rgba(60,100,255,0.3);
  --accent: #4a7aff; --accent2: #8b5cf6; --accent3: #06d6a0;
  --easy: #10b981; --medium: #f59e0b; --hard: #ef4444;
  --text: #e0e6ff; --text2: #8899cc; --text3: #556688;
  --radius: 1rem; --radius-s: 0.6rem;
  --strong: #10b981; --needs-rev: #f59e0b; --forgot: #ef4444; --never: #6b7280;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
}
body::before {
  content:''; position:fixed; inset:0;
  background:radial-gradient(ellipse at 20% 0%, rgba(74,122,255,0.04) 0%, transparent 50%),
             radial-gradient(ellipse at 80% 100%, rgba(139,92,246,0.03) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
.sidebar {
  width:260px; min-width:260px; background:var(--bg2);
  border-right:1px solid var(--border); height:100vh; position:sticky; top:0;
  overflow-y:auto; padding:1.2rem 0; z-index:100;
}
.sidebar-logo {
  padding:0 1.2rem 1rem; font-size:1.2rem; font-weight:800;
  background:linear-gradient(135deg,#60a5fa,#a78bfa,#06d6a0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  border-bottom:1px solid var(--border); margin-bottom:0.8rem;
}
.sidebar-section { padding:0.3rem 1.2rem; font-size:0.65rem; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text3); margin-top:0.3rem; }
.sidebar-link {
  display:flex; align-items:center; gap:0.5rem; padding:0.45rem 1.2rem;
  font-size:0.76rem; color:var(--text2); text-decoration:none; transition:all 0.15s;
  border-left:2px solid transparent; cursor:pointer;
}
.sidebar-link:hover{ background:rgba(74,122,255,0.06); color:var(--text); }
.sidebar-link.active{ background:rgba(74,122,255,0.1); color:var(--accent); border-left-color:var(--accent); }
.sidebar-link .count{ margin-left:auto; font-size:0.6rem; background:rgba(255,255,255,0.05); padding:1px 6px; border-radius:20px; color:var(--text3); }
.main { flex:1; min-width:0; padding:0; position:relative; z-index:1; }
.topbar {
  display:flex; align-items:center; gap:0.8rem; padding:0.8rem 1.5rem;
  background:rgba(15,21,40,0.85); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); position:sticky; top:0; z-index:50; flex-wrap:wrap;
}
.topbar h1{ font-size:1.1rem; font-weight:700; margin-right:auto; }
.topbar .badge{ font-size:0.65rem; background:rgba(74,122,255,0.12); padding:0.2rem 0.7rem; border-radius:30px; border:1px solid rgba(74,122,255,0.2); color:var(--accent); }
.topbar-actions{ display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center; }
.btn {
  padding:0.4rem 1rem; border-radius:30px; border:none; font-weight:600; font-size:0.75rem;
  cursor:pointer; transition:all 0.2s; font-family:inherit; display:inline-flex; align-items:center; gap:0.4rem;
}
.btn-primary{ background:linear-gradient(135deg,#4a7aff,#6c5ce7); color:#fff; }
.btn-primary:hover{ transform:translateY(-1px); box-shadow:0 4px 16px rgba(74,122,255,0.3); }
.btn-secondary{ background:rgba(255,255,255,0.06); color:var(--text); border:1px solid var(--border); }
.btn-secondary:hover{ background:rgba(255,255,255,0.1); border-color:var(--border-h); }
.btn-sm{ padding:0.3rem 0.7rem; font-size:0.65rem; }
.search-bar{ position:relative; min-width:180px; }
.search-bar input{
  width:100%; padding:0.4rem 0.8rem 0.4rem 2rem;
  background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:30px;
  color:var(--text); font-size:0.75rem; font-family:inherit; transition:all 0.2s;
}
.search-bar input:focus{ outline:none; border-color:var(--accent); }
.search-bar input::placeholder{ color:var(--text3); }
.search-bar i{ position:absolute; left:0.7rem; top:50%; transform:translateY(-50%); font-size:0.7rem; color:var(--text3); }
.content{ padding:1.2rem 1.5rem; max-width:1200px; }
.topic-section{ margin-bottom:2rem; scroll-margin-top:70px; }
.topic-header{
  display:flex; align-items:center; gap:0.6rem; padding:0.8rem 1.2rem;
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  margin-bottom:1rem; backdrop-filter:blur(12px);
}
.topic-header .icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; background:rgba(74,122,255,0.1); color:var(--accent); }
.topic-header h2{ font-size:1.05rem; font-weight:700; flex:1; }
.topic-header .count-badge{ font-size:0.65rem; color:var(--text3); }
.problem-card {
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:1rem 1.2rem; margin-bottom:0.8rem; transition:all 0.2s; backdrop-filter:blur(8px);
}
.problem-card:hover{ border-color:var(--border-h); }
.problem-card .top-row{
  display:flex; flex-wrap:wrap; align-items:flex-start; gap:0.5rem; margin-bottom:0.5rem;
}
.problem-card .name{ font-size:0.95rem; font-weight:600; flex:1; min-width:180px; }
.problem-card .difficulty{
  font-size:0.6rem; padding:0.15rem 0.6rem; border-radius:20px; font-weight:600; text-transform:uppercase; height:fit-content;
}
.difficulty.easy{ background:rgba(16,185,129,0.12); color:var(--easy); border:1px solid rgba(16,185,129,0.2); }
.difficulty.medium{ background:rgba(245,158,11,0.12); color:var(--medium); border:1px solid rgba(245,158,11,0.2); }
.difficulty.hard{ background:rgba(239,68,68,0.12); color:var(--hard); border:1px solid rgba(239,68,68,0.2); }
.problem-card .meta-row{ display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:0.5rem; }
.problem-card .meta-tag{ font-size:0.62rem; padding:0.12rem 0.5rem; border-radius:20px; background:rgba(74,122,255,0.06); border:1px solid rgba(74,122,255,0.1); color:var(--text2); }
.problem-card .meta-tag.pattern{ background:rgba(139,92,246,0.06); border-color:rgba(139,92,246,0.12); }
.problem-card .meta-tag.complexity{ background:rgba(6,214,160,0.06); border-color:rgba(6,214,160,0.12); color:var(--accent3); }
.revision-section {
  margin-bottom:0.5rem; padding:0.5rem 0.7rem; background:rgba(0,0,0,0.15);
  border-radius:var(--radius-s); border-left:2px solid rgba(139,92,246,0.3);
}
.revision-section .rev-title{ font-size:0.65rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:0.25rem; }
.revision-section .rev-content{ font-size:0.7rem; color:var(--text2); line-height:1.5; }
.revision-section.pattern-rec{ border-left-color:rgba(6,214,160,0.3); }
.revision-section.pattern-rec .rev-title{ color:var(--accent3); }
.revision-section.edge-cases{ border-left-color:rgba(245,158,11,0.3); }
.revision-section.edge-cases .rev-title{ color:var(--medium); }
.revision-section.mistakes{ border-left-color:rgba(239,68,68,0.3); }
.revision-section.mistakes .rev-title{ color:var(--hard); }
.revision-section.formula{ border-left-color:rgba(74,122,255,0.4); }
.revision-section.formula .rev-title{ color:var(--accent); }
.problem-card .notes{ font-size:0.78rem; color:var(--text2); margin-bottom:0.5rem; line-height:1.5; padding:0.5rem 0.7rem; background:rgba(0,0,0,0.2); border-radius:var(--radius-s); border-left:2px solid rgba(74,122,255,0.2); }
.problem-card .notes strong{ color:var(--accent3); }
.code-block {
  background:#0a0e1a; border:1px solid rgba(255,255,255,0.04); border-radius:var(--radius-s);
  overflow:hidden; margin-bottom:0.3rem;
}
.code-block .code-header{
  display:flex; justify-content:space-between; align-items:center; padding:0.3rem 0.7rem;
  background:rgba(255,255,255,0.02); border-bottom:1px solid rgba(255,255,255,0.03);
  font-size:0.6rem; color:var(--text3);
}
.code-block .copy-btn{ background:none; border:none; color:var(--text3); cursor:pointer; font-size:0.6rem; transition:color 0.15s; }
.code-block .copy-btn:hover{ color:var(--accent); }
.code-toolbar{ display:flex; gap:0.3rem; align-items:center; }
.code-block pre{ margin:0; padding:0.7rem; font-family:'JetBrains Mono',monospace; font-size:0.68rem; line-height:1.45; overflow-x:auto; white-space:pre; color:#abb2bf; }
.code-block pre .line-row{ display:flex; }
.code-block pre .line-num{ display:inline-block; width:2.8em; text-align:right; padding-right:1em; color:rgba(255,255,255,0.12); user-select:none; flex-shrink:0; border-right:1px solid rgba(255,255,255,0.04); margin-right:0.8em; }
.freq-badge{ font-size:0.55rem; padding:0.12rem 0.45rem; border-radius:12px; font-weight:600; }
.freq-badge.freq-rare{ background:rgba(107,114,128,0.15); color:#9ca3af; border:1px solid rgba(107,114,128,0.2); }
.freq-badge.freq-common{ background:rgba(245,158,11,0.12); color:#fbbf24; border:1px solid rgba(245,158,11,0.2); }
.freq-badge.freq-must{ background:rgba(239,68,68,0.12); color:#f87171; border:1px solid rgba(239,68,68,0.25); }
.confidence-row{ display:flex; gap:0.3rem; align-items:center; flex-wrap:wrap; }
.conf-btn{ font-size:0.58rem; padding:0.18rem 0.5rem; border-radius:14px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.03); color:var(--text3); cursor:pointer; transition:all 0.2s; font-family:inherit; }
.conf-btn:hover{ background:rgba(255,255,255,0.08); }
.conf-btn.strong.active{ background:rgba(16,185,129,0.2); border-color:var(--strong); color:var(--strong); }
.conf-btn.needs-rev.active{ background:rgba(245,158,11,0.2); border-color:var(--needs-rev); color:var(--needs-rev); }
.conf-btn.forgot.active{ background:rgba(239,68,68,0.2); border-color:var(--forgot); color:var(--forgot); }
.last-revised{ font-size:0.58rem; color:var(--text3); display:flex; align-items:center; gap:0.2rem; margin-bottom:0.3rem; }
.stats-strip{ display:flex; flex-wrap:wrap; gap:1.2rem; padding:0.6rem 1rem; margin-bottom:1rem; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); font-size:0.72rem; color:var(--text2); align-items:center; }
.stats-strip span{ display:flex; align-items:center; gap:0.3rem; }
.mastery-dashboard{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:1rem 1.2rem; margin-bottom:1rem; backdrop-filter:blur(8px); }
.mastery-dashboard h3{ font-size:0.85rem; font-weight:700; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.4rem; }
.mastery-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:0.7rem; margin-bottom:0.8rem; }
.mastery-card{ background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:var(--radius-s); padding:0.7rem; text-align:center; }
.mastery-card .count{ font-size:1.6rem; font-weight:800; }
.mastery-card .label{ font-size:0.6rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; }
.mastery-card.strong .count{ color:var(--strong); }
.mastery-card.needs-rev .count{ color:var(--needs-rev); }
.mastery-card.forgot .count{ color:var(--forgot); }
.mastery-card.never .count{ color:var(--never); }
.filter-chips{ display:flex; flex-wrap:wrap; gap:0.35rem; margin-bottom:1rem; }
.filter-chip{ padding:0.25rem 0.7rem; border-radius:30px; font-size:0.68rem; cursor:pointer; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text2); transition:all 0.15s; font-family:inherit; }
.filter-chip:hover{ background:rgba(74,122,255,0.08); color:var(--text); }
.filter-chip.active{ background:rgba(74,122,255,0.15); border-color:var(--accent); color:var(--accent); }
.progress-strip{ display:flex; flex-wrap:wrap; gap:0.8rem; padding:0.5rem 0.8rem; margin-bottom:0.8rem; background:rgba(6,214,160,0.04); border:1px solid rgba(6,214,160,0.12); border-radius:var(--radius-s); font-size:0.65rem; align-items:center; color:var(--text2); }
.progress-strip .streak{ color:var(--accent3); font-weight:700; }
.mode-toggle{ display:flex; align-items:center; gap:0.4rem; font-size:0.65rem; color:var(--text2); }
.mode-toggle .switch{ position:relative; width:40px; height:22px; background:rgba(255,255,255,0.1); border-radius:20px; cursor:pointer; border:1px solid var(--border); transition:all 0.2s; }
.mode-toggle .switch::after{ content:''; position:absolute; width:16px; height:16px; background:var(--text3); border-radius:50%; top:2px; left:3px; transition:all 0.2s; }
.mode-toggle .switch.revision-mode{ background:rgba(139,92,246,0.25); border-color:var(--accent2); }
.mode-toggle .switch.revision-mode::after{ background:var(--accent2); left:19px; }
.flashcard-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); backdrop-filter:blur(16px);
  z-index:3000; align-items:center; justify-content:center; flex-direction:column; gap:1rem;
}
.flashcard-overlay.show{ display:flex; }
.flashcard{ width:90%; max-width:520px; min-height:280px; perspective:1000px; cursor:pointer; }
.flashcard-inner{ position:relative; width:100%; height:100%; min-height:280px; transition:transform 0.5s; transform-style:preserve-3d; }
.flashcard-inner.flipped{ transform:rotateY(180deg); }
.flashcard-front,.flashcard-back{ position:absolute; width:100%; height:100%; min-height:280px; backface-visibility:hidden; border-radius:var(--radius); border:2px solid var(--border); padding:2rem; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.flashcard-front{ background:var(--bg2); }
.flashcard-front h2{ font-size:1.3rem; font-weight:700; margin-bottom:0.5rem; }
.flashcard-front .fc-topic{ font-size:0.7rem; color:var(--text3); }
.flashcard-back{ background:var(--bg2); transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; overflow-y:auto; gap:0.6rem; }
.flashcard-back .fc-section{ font-size:0.72rem; color:var(--text2); line-height:1.5; }
.flashcard-back .fc-section strong{ color:var(--accent); }
.flashcard-nav{ display:flex; gap:0.8rem; align-items:center; color:var(--text2); font-size:0.7rem; }
.flashcard-nav .nav-hint{ color:var(--text3); font-size:0.6rem; }
.modal-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
  z-index:1000; align-items:center; justify-content:center;
}
.modal-overlay.show{ display:flex; }
.modal-box{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; max-width:600px; width:92%; max-height:85vh; overflow-y:auto; }
.modal-box h3{ font-size:1rem; margin-bottom:1rem; display:flex; align-items:center; gap:0.5rem; }
.modal-box .form-group{ margin-bottom:0.8rem; }
.modal-box label{ display:block; font-size:0.72rem; color:var(--text2); margin-bottom:0.3rem; font-weight:500; }
.modal-box select,.modal-box input{ width:100%; padding:0.5rem 0.7rem; background:rgba(0,0,0,0.3); border:1px solid var(--border); border-radius:var(--radius-s); color:var(--text); font-size:0.78rem; font-family:inherit; }
.modal-box select:focus,.modal-box input:focus{ outline:none; border-color:var(--accent); }
.modal-box .modal-actions{ display:flex; gap:0.5rem; margin-top:0.8rem; flex-wrap:wrap; }
.random-result{ display:none; margin-top:1rem; padding:1rem; background:rgba(74,122,255,0.06); border:1px solid rgba(74,122,255,0.15); border-radius:var(--radius); animation:slideUp 0.3s ease; }
.random-result.show{ display:block; }
@keyframes slideUp{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:translateY(0); } }
body.cheat-sheet-mode .code-block{ display:none; }
body.cheat-sheet-mode .notes{ display:none; }
.mobile-toggle{
  display:none; position:fixed; bottom:1rem; right:1rem; width:44px; height:44px;
  border-radius:50%; background:var(--accent); color:#fff; border:none; font-size:1.1rem;
  cursor:pointer; z-index:200; box-shadow:0 4px 16px rgba(74,122,255,0.4);
}
.sidebar-backdrop{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:250; }
.sidebar-backdrop.show{ display:block; }
@media (max-width:900px){
  .sidebar{ display:none; position:fixed; left:0; top:0; z-index:300; width:280px; }
  .sidebar.show{ display:block; }
  .mobile-toggle{ display:flex; align-items:center; justify-content:center; }
  .content{ padding:1rem; }
  .topbar{ padding:0.6rem 1rem; }
}
@media (max-width:600px){
  .topbar h1{ font-size:0.9rem; width:100%; }
  .topbar-actions{ width:100%; }
  .search-bar{ width:100%; }
  .problem-card .name{ font-size:0.85rem; }
  .code-block pre{ font-size:0.6rem; }
}
</style>
</head>
<body>

<button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">⚡ Complete DSA</div>
  <div class="sidebar-section">Topics</div>
  <div id="sidebarLinks"></div>
  <div style="margin-top:1rem;padding:0.8rem 1.2rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:0.4rem;">
    <button onclick="openRandomPicker()" class="btn btn-primary" style="width:100%;justify-content:center;font-size:0.72rem">
      <i class="fas fa-dice"></i> Random Problem
    </button>
    <button onclick="openFlashcardMode()" class="btn btn-secondary" style="width:100%;justify-content:center;font-size:0.68rem">
      <i class="fas fa-bolt"></i> Rapid Revision
    </button>
  </div>
</nav>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <h1>📚 Complete DSA Revision</h1>
    <span class="badge"><i class="fas fa-database"></i> <span id="totalCount">0</span> problems</span>
    <div class="mode-toggle">
      <span id="modeLabel">Normal</span>
      <div class="switch" id="modeSwitch" onclick="toggleCheatSheetMode()" title="Toggle Cheat Sheet Mode"></div>
      <span style="color:var(--text3)">Cheat Sheet</span>
    </div>
    <div class="search-bar">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search problems..." oninput="filterProblems()">
    </div>
    <div class="topbar-actions">
      <button class="btn btn-primary" onclick="openRandomPicker()"><i class="fas fa-dice"></i> Random</button>
      <button class="btn btn-secondary" onclick="openFlashcardMode()" title="Rapid Revision"><i class="fas fa-bolt"></i></button>
    </div>
  </div>

  <div class="content">
    <div class="progress-strip" id="progressStrip"></div>
    <div class="mastery-dashboard" id="masteryDashboard">
      <h3><i class="fas fa-chart-pie" style="color:var(--accent2)"></i> Pattern Mastery Dashboard</h3>
      <div class="mastery-grid" id="masteryGrid"></div>
      <div id="masteryTopics"></div>
    </div>
    <div class="filter-chips" id="filterChips">
      <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>
    </div>
    <div class="stats-strip" id="statsStrip"></div>
    <div id="problemContainer"></div>
  </div>
</div>

<!-- Random Picker Modal -->
<div class="modal-overlay" id="randomModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
      <h3><i class="fas fa-dice-d6" style="color:var(--accent)"></i> Smart Random Revision</h3>
      <button onclick="closeRandomPicker()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:1rem;"><i class="fas fa-times"></i></button>
    </div>
    <div class="form-group">
      <label>Revision Mode</label>
      <select id="randomMode">
        <option value="any">🎲 Mixed Mock Interview Mode</option>
        <option value="forgot">🔴 Only Forgotten Problems</option>
        <option value="needs-rev">🟡 Only Needs Revision</option>
        <option value="must-know">🔥 Only Must Know Problems</option>
        <option value="never-reviewed">📭 Never Reviewed</option>
      </select>
    </div>
    <div class="form-group">
      <label>Filter by Topic</label>
      <select id="randomTopicFilter"><option value="all">All Topics</option></select>
    </div>
    <div class="form-group">

        if(p.revision5sec) html += `<div class="revision-section"><div class="rev-title">🧠 5-Second Revision</div><div class="rev-content">${p.revision5sec.replace(/\n/g,'<br>')}</div></div>`;
        if(p.patternRecognition) html += `<div class="revision-section pattern-rec"><div class="rev-title">🔍 Pattern Recognition</div><div class="rev-content">${p.patternRecognition.replace(/\n/g,'<br>')}</div></div>`;
        if(p.edgeCases) html += `<div class="revision-section edge-cases"><div class="rev-title">⚠️ Edge Cases</div><div class="rev-content">${p.edgeCases.replace(/\n/g,'<br>')}</div></div>`;
        if(p.commonMistakes) html += `<div class="revision-section mistakes"><div class="rev-title">❌ Common Mistakes</div><div class="rev-content">${p.commonMistakes.replace(/\n/g,'<br>')}</div></div>`;
        if(p.keyFormula) html += `<div class="revision-section formula"><div class="rev-title">🎯 Key Formula</div><div class="rev-content">${p.keyFormula}</div></div>`;
        html += `<div class="confidence-row">
          <span style="font-size:0.6rem;color:var(--text3);margin-right:0.3rem;">Confidence:</span>
          <button class="conf-btn strong ${cl==='strong'?'active':''}" onclick="setConfidenceLevel('${p.id}','strong')">🟢 Strong</button>
          <button class="conf-btn needs-rev ${cl==='needs-rev'?'active':''}" onclick="setConfidenceLevel('${p.id}','needs-rev')">🟡 Needs Revision</button>
          <button class="conf-btn forgot ${cl==='forgot'?'active':''}" onclick="setConfidenceLevel('${p.id}','forgot')">🔴 Forgot</button>
        </div>
        <div class="last-revised"><i class="fas fa-history"></i> Last Revised: ${getTimeAgo(last)}</div>`;
        if(p.notes) html += `<div class="notes"><strong>💡 Approach:</strong> ${p.notes}</div>`;
        html += renderCodeBlock(p, cid);
        html += `</div>`;
      }
      html += `</div>`;
    }
    container.innerHTML = html;
  }

  function updateStats() {
    document.getElementById('totalCount').textContent = PROBLEMS.length;
    const total = filteredProblems.length;
    const easy = filteredProblems.filter(p => p.difficulty==='easy').length;
    const med = filteredProblems.filter(p => p.difficulty==='medium').length;
    const hard = filteredProblems.filter(p => p.difficulty==='hard').length;
    const topics = [...new Set(filteredProblems.map(p=>p.topic))].length;
    document.getElementById('statsStrip').innerHTML = `
      <span><i class="fas fa-list" style="color:var(--accent)"></i> ${total} problems</span>
      <span><i class="fas fa-folder" style="color:var(--accent2)"></i> ${topics} topics</span>
      <span><span style="color:var(--easy)">●</span> ${easy} Easy</span>
      <span><span style="color:var(--medium)">●</span> ${med} Medium</span>
      <span><span style="color:var(--hard)">●</span> ${hard} Hard</span>
    `;
    updateMasteryDashboard();
    updateProgressStrip();
  }

  function updateMasteryDashboard() {
    const conf = getConfidence();
    let strong=0, needsRev=0, forgot=0, never=0;
    const topicStats = {};
    for(const p of PROBLEMS) {
      const l = conf[p.id] || 'never';
      if(l==='strong') strong++;
      else if(l==='needs-rev') needsRev++;
      else if(l==='forgot') forgot++;
      else never++;
      if(!topicStats[p.topic]) topicStats[p.topic] = {total:0, strong:0};
      topicStats[p.topic].total++;
      if(l==='strong') topicStats[p.topic].strong++;
    }
    document.getElementById('masteryGrid').innerHTML = `
      <div class="mastery-card strong"><div class="count">${strong}</div><div class="label">🟢 Strong</div></div>
      <div class="mastery-card needs-rev"><div class="count">${needsRev}</div><div class="label">🟡 Needs Revision</div></div>
      <div class="mastery-card forgot"><div class="count">${forgot}</div><div class="label">🔴 Forgot</div></div>
      <div class="mastery-card never"><div class="count">${never}</div><div class="label">⬜ Never Reviewed</div></div>
    `;
    let th='';
    for(const [topic, stats] of Object.entries(topicStats)) {
      const pct = stats.total ? Math.round(stats.strong/stats.total*100) : 0;
      th += `<div class="mastery-topic-row"><span class="topic-name">${topic}</span><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`;
    }
    document.getElementById('masteryTopics').innerHTML = th;
  }

  function updateProgressStrip() {
    const streak = getStreak();
    const today = new Date().toISOString().split('T')[0];
    const todayCount = streak.todayDate===today ? streak.todayCount : 0;
    const curStreak = streak.todayDate===today ? streak.streak : (streak.lastDate===new Date(new Date().setDate(new Date().getDate()-1)).toISOString().split('T')[0] ? streak.streak : 0);
    document.getElementById('progressStrip').innerHTML = `
      <span><i class="fas fa-book-open" style="color:var(--accent3)"></i> Reviewed: <strong>${totalReviewedCount}</strong></span>
      <span class="streak"><i class="fas fa-fire"></i> Streak: <strong>${curStreak} days</strong></span>
      <span><i class="fas fa-calendar-check" style="color:var(--accent)"></i> Today: <strong>${todayCount}</strong></span>
    `;
  }

  function filterProblems() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filteredProblems = PROBLEMS.filter(p => {
      if(activeFilter!=='all' && p.topic!==activeFilter) return false;
      if(q && !p.name.toLowerCase().includes(q) && !p.topic.toLowerCase().includes(q) && !p.pattern.toLowerCase().includes(q)) return false;
      return true;
    });
    renderProblems();
    updateStats();
  }

  function setFilter(topic) {
    activeFilter = topic;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter===topic));
    filterProblems();
  }

  function buildSidebar() {
    const topics = getTopics();
    const sidebar = document.getElementById('sidebarLinks');
    let html = '';
    for(const t of topics) {
      const count = PROBLEMS.filter(p=>p.topic===t).length;
      html += `<a class="sidebar-link" href="#topic-${t.replace(/\s+/g,'-')}" onclick="closeSidebar()">${t} <span class="count">${count}</span></a>`;
    }
    sidebar.innerHTML = html;
    const chips = document.getElementById('filterChips');
    let ch = `<button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All (${PROBLEMS.length})</button>`;
    for(const t of topics) {
      const count = PROBLEMS.filter(p=>p.topic===t).length;
      ch += `<button class="filter-chip" data-filter="${t}" onclick="setFilter('${t}')">${t} (${count})</button>`;
    }
    chips.innerHTML = ch;
  }

  function init() {
    try {
      const hist = getRevisionHistory();
      totalReviewedCount = hist.length;
      buildSidebar();
      filterProblems();
      updateStats();
      updateMasteryDashboard();
      updateProgressStrip();
      // populate random topic filter
      const sel = document.getElementById('randomTopicFilter');
      for(const t of getTopics()) {
        sel.innerHTML += `<option value="${t}">${t}</option>`;
      }
      console.log('✅ DSA Revision Hub ready');
    } catch(e) {
      console.error('❌ Init error:', e);
      document.getElementById('problemContainer').innerHTML = '<div style="color:red;padding:2rem;">Something went wrong. Please check the console for details.</div>';
    }
  }

  // Random Picker
  window.openRandomPicker = function() { document.getElementById('randomModal').classList.add('show'); document.getElementById('randomResult').classList.remove('show'); };
  window.closeRandomPicker = function() { document.getElementById('randomModal').classList.remove('show'); };
  window.pickRandom = function() {
    const mode = document.getElementById('randomMode').value;
    const topic = document.getElementById('randomTopicFilter').value;
    const diff = document.getElementById('randomDifficultyFilter').value;
    let pool = [...PROBLEMS];
    const conf = getConfidence();
    if(mode==='forgot') pool = pool.filter(p => (conf[p.id]||'never')==='forgot');
    else if(mode==='needs-rev') pool = pool.filter(p => (conf[p.id]||'never')==='needs-rev');
    else if(mode==='must-know') pool = pool.filter(p => p.frequency===3);
    else if(mode==='never-reviewed') pool = pool.filter(p => !conf[p.id] || conf[p.id]==='never');
    if(topic!=='all') pool = pool.filter(p => p.topic===topic);
    if(diff!=='all') pool = pool.filter(p => p.difficulty===diff);
    if(!pool.length) {
      document.getElementById('randomResult').innerHTML = '<div style="text-align:center;padding:1rem;color:var(--text3)">No problems found</div>';
      document.getElementById('randomResult').classList.add('show');
      return;
    }
    const p = pool[Math.floor(Math.random()*pool.length)];
    recordRevision(p.id);
    const cid = 'rcode-'+Date.now();
    document.getElementById('randomResult').innerHTML = `
      <div class="problem-card" style="margin:0;border-color:var(--accent);">
        <div class="top-row"><span class="name">${p.name}</span><span class="difficulty ${p.difficulty}">${p.difficulty}</span></div>
        <div class="meta-row">
          <span class="meta-tag"><i class="fas fa-folder"></i> ${p.topic}</span>
          <span class="meta-tag pattern"><i class="fas fa-tag"></i> ${p.pattern}</span>
          <span class="meta-tag complexity">${p.tc}</span>
          <span class="meta-tag complexity">${p.sc}</span>
        </div>
        ${p.revision5sec ? `<div class="revision-section"><div class="rev-title">🧠 5-Second Revision</div><div class="rev-content">${p.revision5sec.replace(/\n/g,'<br>')}</div></div>` : ''}
        ${p.edgeCases ? `<div class="revision-section edge-cases"><div class="rev-title">⚠️ Edge Cases</div><div class="rev-content">${p.edgeCases.replace(/\n/g,'<br>')}</div></div>` : ''}
        ${p.keyFormula ? `<div class="revision-section formula"><div class="rev-title">🎯 Key Formula</div><div class="rev-content">${p.keyFormula}</div></div>` : ''}
        ${p.notes ? `<div class="notes"><strong>💡 Approach:</strong> ${p.notes}</div>` : ''}
        ${renderCodeBlock(p, cid)}
      </div>
    `;
    document.getElementById('randomResult').classList.add('show');
  };

  // Flashcard Mode
  let flashcardPool = [], flashcardIndex=0, flashcardFlipped=false;
  window.openFlashcardMode = function() {
    flashcardPool = [...PROBLEMS];
    flashcardIndex=0; flashcardFlipped=false;
    document.getElementById('flashcardOverlay').classList.add('show');
    document.getElementById('flashcardInner').classList.remove('flipped');
    showFlashcard();
    document.body.style.overflow = 'hidden';
  };
  window.closeFlashcardMode = function() {
    document.getElementById('flashcardOverlay').classList.remove('show');
    document.body.style.overflow = '';
  };
  function showFlashcard() {
    if(!flashcardPool.length){ window.closeFlashcardMode(); return; }
    const p = flashcardPool[flashcardIndex];
    document.getElementById('fcName').textContent = p.name;
    document.getElementById('fcTopic').textContent = p.topic+' · '+p.difficulty;
    document.getElementById('fcPattern').textContent = p.pattern || 'N/A';
    document.getElementById('fcKeyIdea').textContent = (p.revision5sec || p.notes || 'N/A').replace(/\n/g,' | ');
    document.getElementById('fcEdges').textContent = p.edgeCases || 'N/A';
    document.getElementById('fcFormula').textContent = p.keyFormula || 'N/A';
    document.getElementById('fcCounter').textContent = `${flashcardIndex+1} / ${flashcardPool.length}`;
    flashcardFlipped = false;
    document.getElementById('flashcardInner').classList.remove('flipped');
    recordRevision(p.id);
  }
  window.flipFlashcard = function() {
    flashcardFlipped = !flashcardFlipped;
    document.getElementById('flashcardInner').classList.toggle('flipped', flashcardFlipped);
  };
  window.nextFlashcard = function() { flashcardIndex = (flashcardIndex+1)%flashcardPool.length; showFlashcard(); };
  window.prevFlashcard = function() { flashcardIndex = (flashcardIndex-1+flashcardPool.length)%flashcardPool.length; showFlashcard(); };
  document.addEventListener('keydown', function(e) {
    if(!document.getElementById('flashcardOverlay').classList.contains('show')) return;
    if(e.key===' ' || e.code==='Space'){ e.preventDefault(); window.flipFlashcard(); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); window.nextFlashcard(); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); window.prevFlashcard(); }
    else if(e.key==='Escape') window.closeFlashcardMode();
  });

  // Cheat Sheet Toggle
  window.toggleCheatSheetMode = function() {
    cheatSheetMode = !cheatSheetMode;
    const sw = document.getElementById('modeSwitch');
    const label = document.getElementById('modeLabel');
    if(cheatSheetMode) {
      document.body.classList.add('cheat-sheet-mode');
      sw.classList.add('revision-mode');
      label.textContent = 'Revision';
      label.style.color = 'var(--accent2)';
    } else {
      document.body.classList.remove('cheat-sheet-mode');
      sw.classList.remove('revision-mode');
      label.textContent = 'Normal';
      label.style.color = 'var(--text2)';
    }
  };

  // Mobile Sidebar
  document.getElementById('mobileToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('show');
    document.getElementById('sidebarBackdrop').classList.toggle('show');
  });
  window.closeSidebar = function() {
    document.getElementById('sidebar').classList.remove('show');
    document.getElementById('sidebarBackdrop').classList.remove('show');
  };
  document.getElementById('sidebarBackdrop').addEventListener('click', window.closeSidebar);

  // Init on DOM ready
  document.addEventListener('DOMContentLoaded', init);

})(); // end IIFE
</script>
</body>
</html>
