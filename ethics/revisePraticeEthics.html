        :root {

            --text: #e6edf3;
            --text2: #c9d1d9;
            --text3: #8b949e;
            --accent: #58a6ff;
            --accent2: #238636;
            --danger: #f85149;
            --warning: #d2991d;
            --purple: #a371f7;
            --cyan: #39d2c0;
            --orange: #f0883e;

        * {

            box-sizing: border-box;
        }
        body {

            z-index: 100;
            padding-bottom: 20px;
            transition: transform 0.3s;
        }
        .sidebar-header {

            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface);

        .sidebar-header h2 {

            color: var(--accent);

        .sidebar-nav {

        .sidebar-nav .unit-btn {

            align-items: center;
            width: 100%;
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text2);
            cursor: pointer;
            font-size: 0.9rem;
            text-align: left;
            gap: 10px;
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar-nav .unit-btn:hover {
            background: var(--surface2);
            color: var(--text);

        }
        .sidebar-nav .unit-btn.active {

            color: var(--accent);

        .unit-icon {

            width: 24px;
            text-align: center;

        .sidebar-footer {

            margin-top: 8px;
            position: sticky;
            bottom: 0;
            background: var(--surface);

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text2);
            font-size: 0.8rem;
        }
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: var(--surface2);
            border-radius: 12px;
            position: relative;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            top: 2px;
            left: 3px;
            transition: all 0.3s;
        }
        .light-mode .toggle-switch {
            background: #d0d7de;
        }
        .light-mode .toggle-switch::after {
            left: 21px;
            background: #f0883e;
        }

            margin-left: var(--sidebar-w);
            flex: 1;
            min-height: 100vh;
            padding: 0;

        .topbar {
            height: var(--header-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 50;
            gap: 16px;

        .topbar h1 {
            font-size: 1.2rem;
            font-weight: 600;
            flex: 1;
        }
        .topbar .badge {
            background: var(--accent2);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .topbar .badge.warn {
            background: var(--warning);
            color: #000;
        }
        .hamburger {

            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
        }
        .content-area {
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }

            display: none;
        }
        .unit-content.active {
            display: block;
        }
        .revision-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: all 0.2s;

            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }
        .revision-card h3 {
            color: var(--accent);
            font-size: 1.05rem;

            display: flex;
            align-items: center;
            gap: 8px;
        }
        .revision-card h4 {
            color: var(--purple);
            font-size: 0.9rem;
            margin: 10px 0 6px;
        }
        .revision-card ul {
            list-style: none;
            padding: 0;
        }
        .revision-card ul li {
            padding: 4px 0 4px 20px;
            position: relative;
            color: var(--text2);
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .revision-card ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-size: 0.7rem;
            top: 6px;
        }

            background: var(--surface2);
            border-left: 3px solid var(--warning);
            padding: 10px 14px;
            border-radius: 0 6px 6px 0;
            margin: 10px 0;
            font-size: 0.85rem;
        }
        .revision-card table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin: 8px 0;
        }
        .revision-card table th,
        .revision-card table td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            text-align: left;
        }
        .revision-card table th {
            background: var(--surface2);
            color: var(--accent);
            font-weight: 600;
        }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin: 2px 4px 2px 0;

        .tag-red {
            background: #f8514922;
            color: var(--danger);
        }
        .tag-green {
            background: #23863622;
            color: #3fb950;
        }
        .tag-blue {
            background: #58a6ff22;
            color: var(--accent);
        }
        .tag-purple {
            background: #a371f722;
            color: var(--purple);
        }
        .tag-orange {
            background: #f0883e22;
            color: var(--orange);

            flex-wrap: wrap;

            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;

            border-color: var(--accent2);
            color: #fff;
            font-weight: 600;
        }

        }

            background: transparent;
            border-color: var(--accent);
            color: var(--accent);
        }

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 12px;
        }
        .mcq-card .q-num {
            color: var(--text3);
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .mcq-card .question {
            font-weight: 600;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .mcq-card .options {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .mcq-card .opt-btn {
            display: block;
            width: 100%;
            padding: 10px 14px;
            text-align: left;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text2);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.15s;
        }
        .mcq-card .opt-btn:hover {
            border-color: var(--accent);
            background: #58a6ff11;
        }
        .mcq-card .opt-btn.selected {
            border-color: var(--accent);
            background: #58a6ff22;
            color: var(--accent);
            font-weight: 600;
        }
        .mcq-card .opt-btn.correct {
            border-color: #3fb950;
            background: #23863622;
            color: #3fb950;
        }
        .mcq-card .opt-btn.wrong {
            border-color: var(--danger);
            background: #f8514922;
            color: var(--danger);
        }
        .mcq-card .explanation {
            margin-top: 8px;
            padding: 10px 14px;
            background: var(--surface2);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text3);
            display: none;
        }
        .mcq-card .explanation.show {
            display: block;
        }
        .score-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .score-bar .score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .score-bar .stats {
            font-size: 0.85rem;
            color: var(--text3);
        }
        .progress-ring {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 4px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .tab-nav {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }
        .tab-nav button {
            padding: 10px 20px;
            border: none;
            background: transparent;
            color: var(--text3);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .tab-nav button.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .tab-panel {
            display: none;
        }
        .tab-panel.active {
            display: block;
        }
        /* Light mode */
        body.light-mode {
            --bg: #ffffff;
            --surface: #f6f8fa;
            --surface2: #eaeef2;
            --border: #d0d7de;
            --text: #1f2328;
            --text2: #424a53;
            --text3: #656d76;
            --accent: #0969da;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
            }
            .hamburger {
                display: block;
            }
            .content-area {
                padding: 14px;
            }
            .revision-card {
                padding: 14px 16px;
            }
            .revision-card ul li {
                font-size: 0.82rem;
            }
        }
        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
        }
        .overlay.show {
            display: block;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .emoji-big {
            font-size: 1.4rem;
        }
    </style>
</head>

        function renderRevision() {
            const container = document.getElementById('revisionContent');
            const data = unitData[currentUnit];
            if (!data) { container.innerHTML =
                    '<p style="color:var(--text3)">Select a unit from the sidebar to view revision notes.</p>'; return; }
            let html = `<h2 style="margin-bottom:16px;color:var(--accent);">${data.title}</h2>`;
            data.cards.forEach(card => {
                html += `<div class="revision-card"><h3>${card.title}</h3>${card.content}</div>`;
            });
            container.innerHTML = html;
        }

        function renderMCQSection() {
            const container = document.getElementById('mcqContainer');
            let html = `
        <div class="mcq-controls">
          <select id="mcqTopicSelect" onchange="onMCQTopicChange()">
            <option value="unit1">Unit 1: Ethics</option>
            <option value="unit2">Unit 2: IPR</option>
            <option value="unit3">Unit 3: Startup Schemes</option>
            <option value="unit4">Unit 4: Startup in IT</option>
            <option value="unit5">Unit 5: Companies</option>
            <option value="unit6">Unit 6: InfoSec Law</option>
            <option value="all">🔀 All Topics (Random 30)</option>
          </select>
          <button onclick="startMCQ()">▶ Start / Reload MCQs</button>
          <button class="outline" onclick="submitMCQ()">✅ Submit & Check</button>
          <button class="outline" onclick="resetMCQ()">🔄 Reset</button>
        </div>
        <div id="mcqScoreBar"></div>
        <div id="mcqList"></div>`;
            container.innerHTML = html;
            document.getElementById('mcqTopicSelect').value = mcqTopic;
            startMCQ();
        }

        function onMCQTopicChange() {
            mcqTopic = document.getElementById('mcqTopicSelect').value;
            startMCQ();
        }

        function startMCQ() {
            mcqSubmitted = false;
            userAnswers = {};
            let pool = [];
            const topic = document.getElementById('mcqTopicSelect')?.value || mcqTopic;
            mcqTopic = topic;
            if (topic === 'all') {
                pool = [...mcqBank];
                // Shuffle and pick 30
                pool = shuffleArray(pool).slice(0, 30);
            } else {
                pool = mcqBank.filter(m => m.unit === topic);
                if (pool.length === 0) pool = [...mcqBank]; // fallback
            }
            currentMCQs = pool;
            renderMCQList();
            document.getElementById('mcqScoreBar').innerHTML = '';
        }

        function renderMCQList() {
            const list = document.getElementById('mcqList');
            if (!list) return;
            let html = '';
            currentMCQs.forEach((mcq, i) => {
                const answered = userAnswers[i] !== undefined;
                html += `<div class="mcq-card" id="mcqCard${i}">
            <div class="q-num">Q${i+1} of ${currentMCQs.length} ${mcq.unit ? '['+mcq.unit.toUpperCase()+']' : ''}</div>
            <div class="question">${mcq.q}</div>
            <div class="options">`;
                mcq.opts.forEach((opt, oi) => {
                    let cls = 'opt-btn';
                    if (answered && userAnswers[i] === oi) cls += ' selected';
                    if (mcqSubmitted) {
                        if (oi === mcq.ans) cls += ' correct';
                        else if (userAnswers[i] === oi && oi !== mcq.ans) cls += ' wrong';
                    }
                    const disabled = mcqSubmitted ? 'disabled' : '';
                    html +=
                        `<button class="${cls}" ${disabled} onclick="selectAnswer(${i}, ${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
                });
                html += `</div>`;
                if (mcqSubmitted) {
                    html +=
                        `<div class="explanation show">💡 <strong>Explanation:</strong> ${mcq.exp} | Correct: <strong>${String.fromCharCode(65+mcq.ans)}</strong></div>`;
                }
                html += `</div>`;
            });
            list.innerHTML = html || '<p style="color:var(--text3)">No MCQs available for this topic.</p>';
        }

        function selectAnswer(qIdx, optIdx) {
            if (mcqSubmitted) return;
            userAnswers[qIdx] = optIdx;
            renderMCQList();
        }

        function submitMCQ() {
            mcqSubmitted = true;
            renderMCQList();
            let correct = 0;
            const total = currentMCQs.length;
            currentMCQs.forEach((mcq, i) => {
                if (userAnswers[i] === mcq.ans) correct++;
            });
            const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
            let gradeColor = pct >= 80 ? '#3fb950' : pct >= 50 ? '#d2991d' : '#f85149';
            document.getElementById('mcqScoreBar').innerHTML = `
        <div class="score-bar">
          <div style="display:flex;align-items:center;gap:16px;">
            <div class="progress-ring" style="border-color:${gradeColor};color:${gradeColor};">${pct}%</div>
            <div>
              <div class="score" style="color:${gradeColor};">${correct}/${total} Correct</div>
              <div class="stats">${total} questions | ${mcqTopic==='all'?'All Topics':mcqTopic.toUpperCase()}</div>
            </div>
          </div>
          <span class="badge ${pct>=50?'':'warn'}">${pct>=80?'🌟 Excellent!':pct>=60?'👍 Good':pct>=40?'📖 Keep Studying':'📚 Needs Review'}</span>
        </div>`;
            // Scroll to score bar
            document.getElementById('mcqScoreBar').scrollIntoView({ behavior: 'smooth' });
        }

        function resetMCQ() {
            mcqSubmitted = false;
            userAnswers = {};
            currentMCQs = [];
            document.getElementById('mcqScoreBar').innerHTML = '';
            document.getElementById('mcqList').innerHTML =
                '<p style="color:var(--text3)">Click <strong>Start / Reload MCQs</strong> to begin.</p>';
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebarOpen = !sidebarOpen;
            sidebar.classList.toggle('open', sidebarOpen);
            overlay.classList.toggle('show', sidebarOpen);
        }

        function closeSidebar() {
            sidebarOpen = false;
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function toggleLightMode() {
            document.body.classList.toggle('light-mode');
            const label = document.getElementById('modeLabel');
            if (document.body.classList.contains('light-mode')) {
                label.textContent = 'Light Mode';
                localStorage.setItem('cse332-mode', 'light');
            } else {
                label.textContent = 'Dark Mode';
                localStorage.setItem('cse332-mode', 'dark');
            }
        }

        // ==================== INIT ====================
        function init() {
            // Restore mode
            if (localStorage.getItem('cse332-mode') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('modeLabel').textContent = 'Light Mode';
            }
            // Render default unit
            renderRevision();
            // Handle resize
            window.addEventListener('resize', () => {
                if (window.innerWidth > 768 && sidebarOpen) closeSidebar();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
        // Expose functions globally
        window.switchUnit = switchUnit;
        window.switchTab = switchTab;
        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;
        window.toggleLightMode = toggleLightMode;
        window.startMCQ = startMCQ;
        window.submitMCQ = submitMCQ;
        window.resetMCQ = resetMCQ;
        window.selectAnswer = selectAnswer;
        window.onMCQTopicChange = onMCQTopicChange;
    </script>
</body>
</html>
