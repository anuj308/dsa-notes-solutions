// ---------- APP STATE & FUNCTIONS ----------
let currentUnit = 'unit1';
let currentTab = 'revision';
let mcqTopic = 'unit1';
let currentMCQs = [];
let userAnswers = {};
let mcqSubmitted = false;
let sidebarOpen = false;

function switchUnit(unit, btn) {
  currentUnit = unit;
  document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('topTitle').textContent = unitData[unit] ? unitData[unit].title : 'Practice MCQs';
  document.getElementById('topBadge').textContent = unit === 'mcq' ? 'MCQ Practice' : 'Revision';
  if (unit === 'mcq') {
    currentTab = 'mcq-practice';
    document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
    document.querySelector('#tabNav button[data-tab="mcq-practice"]').classList.add('active');
    document.getElementById('panel-revision').classList.remove('active');
    document.getElementById('panel-mcq-practice').classList.add('active');
    document.getElementById('revisionContent').innerHTML = '';
    renderMCQSection();
  } else {
    currentTab = 'revision';
    document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
    document.querySelector('#tabNav button[data-tab="revision"]').classList.add('active');
    document.getElementById('panel-revision').classList.add('active');
    document.getElementById('panel-mcq-practice').classList.remove('active');
    document.getElementById('mcqContainer').innerHTML = '';
    renderRevision();
  }
  if (sidebarOpen && window.innerWidth <= 768) closeSidebar();
}

function switchTab(tab, btn) {
  currentTab = tab;
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('panel-revision').classList.toggle('active', tab === 'revision');
  document.getElementById('panel-mcq-practice').classList.toggle('active', tab === 'mcq-practice');
  if (tab === 'revision') renderRevision();
  else renderMCQSection();
}

function renderRevision() {
  const container = document.getElementById('revisionContent');
  const data = unitData[currentUnit];
  if (!data) { container.innerHTML = '<p style="color:var(--text3)">Select a unit.</p>'; return; }
  let html = `<h2 style="margin-bottom:16px;color:var(--accent);">${data.title}</h2>`;
  data.cards.forEach(c => html += `<div class="revision-card"><h3>${c.title}</h3>${c.content}</div>`);
  container.innerHTML = html;
}

function renderMCQSection() {
  const container = document.getElementById('mcqContainer');
  container.innerHTML = `
    <div class="mcq-controls" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
      <select id="mcqTopicSelect" onchange="onMCQTopicChange()" style="padding:10px; border-radius:8px; background:var(--surface); color:var(--text); border:1px solid var(--border);">
        <option value="unit1">Unit 1: Ethics</option>
        <option value="unit2">Unit 2: IPR</option>
        <option value="unit3">Unit 3: Startup Schemes</option>
        <option value="unit4">Unit 4: IT Startup Plan</option>
        <option value="unit5">Unit 5: IT Industry</option>
        <option value="unit6">Unit 6: InfoSec Law</option>
        <option value="all">🔀 All Topics (Random 30)</option>
      </select>
      <button onclick="startMCQ()" style="padding:10px 16px; background:var(--accent2); color:#fff; border:none; border-radius:8px; cursor:pointer;">▶ Start / Reload</button>
      <button onclick="submitMCQ()" style="padding:10px 16px; background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:8px; cursor:pointer;">✅ Submit</button>
      <button onclick="resetMCQ()" style="padding:10px 16px; background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; cursor:pointer;">🔄 Reset</button>
    </div>
    <div id="mcqScoreBar"></div>
    <div id="mcqList"></div>`;
  document.getElementById('mcqTopicSelect').value = mcqTopic;
  startMCQ();
}

function onMCQTopicChange() { mcqTopic = document.getElementById('mcqTopicSelect').value; startMCQ(); }

function startMCQ() {
  mcqSubmitted = false;
  userAnswers = {};
  const topic = document.getElementById('mcqTopicSelect')?.value || mcqTopic;
  mcqTopic = topic;
  let pool = topic === 'all' ? [...mcqBank] : mcqBank.filter(m => m.unit === topic);
  if (topic === 'all') pool = shuffleArray(pool).slice(0, 30);
  currentMCQs = pool;
  renderMCQList();
  document.getElementById('mcqScoreBar').innerHTML = '';
}

function renderMCQList() {
  const list = document.getElementById('mcqList');
  let html = '';
  currentMCQs.forEach((mcq, i) => {
    html += `<div class="mcq-card"><div class="q-num">Q${i+1}/${currentMCQs.length} [${mcq.unit}]</div><div class="question">${mcq.q}</div><div class="options">`;
    mcq.opts.forEach((opt, oi) => {
      let cls = 'opt-btn';
      if (userAnswers[i] === oi) cls += ' selected';
      if (mcqSubmitted) {
        if (oi === mcq.ans) cls += ' correct';
        else if (userAnswers[i] === oi) cls += ' wrong';
      }
      html += `<button class="${cls}" ${mcqSubmitted ? 'disabled' : ''} onclick="selectAnswer(${i},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
    });
    html += `</div>${mcqSubmitted ? `<div class="explanation show">💡 ${mcq.exp||'Correct answer.'} | Correct: ${String.fromCharCode(65+mcq.ans)}</div>` : ''}</div>`;
  });
  list.innerHTML = html || '<p>No questions.</p>';
}

function selectAnswer(qIdx, oi) { if (!mcqSubmitted) { userAnswers[qIdx] = oi; renderMCQList(); } }

function submitMCQ() {
  mcqSubmitted = true; renderMCQList();
  let correct = 0;
  currentMCQs.forEach((m,i) => { if (userAnswers[i] === m.ans) correct++; });
  const pct = Math.round((correct/currentMCQs.length)*100) || 0;
  const color = pct>=80?'#3fb950':pct>=50?'#d2991d':'#f85149';
  document.getElementById('mcqScoreBar').innerHTML = `
    <div class="score-bar">
      <div style="display:flex;align-items:center;gap:16px;">
        <div class="progress-ring" style="border-color:${color};color:${color};">${pct}%</div>
        <div><div class="score" style="color:${color};">${correct}/${currentMCQs.length} Correct</div><div class="stats">${mcqTopic==='all'?'All Topics':mcqTopic}</div></div>
      </div>
      <span class="badge" style="background:${pct>=80?'#238636':pct>=50?'#d2991d':'#f85149'}">${pct>=80?'🌟 Excellent':pct>=60?'👍 Good':pct>=40?'📖 Keep studying':'📚 Needs review'}</span>
    </div>`;
}

function resetMCQ() { mcqSubmitted=false; userAnswers={}; currentMCQs=[]; document.getElementById('mcqList').innerHTML='<p>Click Start to begin.</p>'; document.getElementById('mcqScoreBar').innerHTML=''; }

function shuffleArray(a){ const arr=[...a]; for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

function toggleSidebar(){ sidebarOpen=!sidebarOpen; document.getElementById('sidebar').classList.toggle('open',sidebarOpen); document.getElementById('overlay').classList.toggle('show',sidebarOpen); }
function closeSidebar(){ sidebarOpen=false; document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }
function toggleLightMode(){
  document.body.classList.toggle('light-mode');
  const label=document.getElementById('modeLabel');
  if(document.body.classList.contains('light-mode')){ label.textContent='Light Mode'; localStorage.setItem('cse332-mode','light'); }
  else { label.textContent='Dark Mode'; localStorage.setItem('cse332-mode','dark'); }
}

window.addEventListener('DOMContentLoaded',()=>{
  if(localStorage.getItem('cse332-mode')==='light'){ document.body.classList.add('light-mode'); document.getElementById('modeLabel').textContent='Light Mode'; }
  renderRevision();
});
</script>
